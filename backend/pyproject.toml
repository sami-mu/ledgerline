[project]
name = "invoice-backend"
version = "0.1.0"
description = "Invoice generator API: storage, totals and email delivery"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.3",
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
